name: CI

on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  TERRAFORM_VERSION: "1.14.3"

jobs:
  python:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check lambda tests

      - name: Ruff format check
        run: ruff format --check lambda tests

      - name: Pytest
        run: pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore

  terraform:
    name: Terraform checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Format check
        run: terraform fmt -check -recursive terraform

      # -backend=false: validation needs providers, not remote state or creds.
      - name: Init
        run: terraform -chdir=terraform init -backend=false -input=false

      - name: Validate
        run: terraform -chdir=terraform validate

  package:
    name: Build Lambda package
    runs-on: ubuntu-latest
    needs: python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Build deployment zip
        run: ./scripts/build_lambda.sh

      - name: Verify the package imports cleanly
        run: |
          mkdir -p /tmp/verify && unzip -q build/lambda.zip -d /tmp/verify
          test -f /tmp/verify/app.py
          PYTHONPATH=/tmp/verify python -c "import app; print('handler:', app.handler)"

      - uses: actions/upload-artifact@v4
        with:
          name: lambda-package
          path: build/lambda.zip
          retention-days: 7
