name: Deploy

# Pipeline: fmt -> validate -> plan -> manual approval -> apply -> build -> zip
# -> upload to S3 -> update Lambda.
#
# The approval gate is the `production` GitHub Environment: configure it with
# required reviewers so `apply` cannot run unattended.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   AWS_ACCESS_KEY_ID
#   AWS_SECRET_ACCESS_KEY
#   AWS_REGION
#   TF_STATE_BUCKET           bucket holding Terraform remote state
#   LAMBDA_ARTIFACT_BUCKET    bucket the deployment zip is uploaded to
#
# The last three are not sensitive; they may be set as repository *variables*
# instead — every reference below falls back from secrets to vars.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [prod, staging]
        default: prod

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  TERRAFORM_VERSION: "1.14.3"
  TF_ENVIRONMENT: ${{ inputs.environment || 'prod' }}

jobs:
  plan:
    name: Terraform plan
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ secrets.AWS_REGION || vars.AWS_REGION }}
      TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET || vars.TF_STATE_BUCKET }}
    steps:
      - uses: actions/checkout@v4

      # Fails with a readable message instead of the action's opaque
      # "Input required and not supplied: aws-region".
      - name: Preflight — required configuration
        env:
          ACCESS_KEY_SET: ${{ secrets.AWS_ACCESS_KEY_ID != '' }}
          SECRET_KEY_SET: ${{ secrets.AWS_SECRET_ACCESS_KEY != '' }}
        run: |
          missing=()
          [ "$ACCESS_KEY_SET" = "true" ] || missing+=("AWS_ACCESS_KEY_ID (secret)")
          [ "$SECRET_KEY_SET" = "true" ] || missing+=("AWS_SECRET_ACCESS_KEY (secret)")
          [ -n "$AWS_REGION" ]           || missing+=("AWS_REGION (secret or variable)")
          [ -n "$TF_STATE_BUCKET" ]      || missing+=("TF_STATE_BUCKET (secret or variable)")
          if [ ${#missing[@]} -gt 0 ]; then
            printf '::error::Missing required configuration: %s\n' "${missing[*]}"
            echo "Set these under Settings -> Secrets and variables -> Actions." >&2
            exit 1
          fi
          echo "Region: $AWS_REGION | State bucket: $TF_STATE_BUCKET"

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Built before plan so source_code_hash reflects the code being deployed.
      - name: Build deployment zip
        run: ./scripts/build_lambda.sh

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify credentials
        run: aws sts get-caller-identity

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Format check
        run: terraform fmt -check -recursive terraform

      - name: Init
        run: |
          terraform -chdir=terraform init -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=ai-log-investigator/${TF_ENVIRONMENT}/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Validate
        run: terraform -chdir=terraform validate

      - name: Check environment tfvars exist
        run: |
          if [ ! -f "terraform/${TF_ENVIRONMENT}.tfvars" ]; then
            echo "::error::terraform/${TF_ENVIRONMENT}.tfvars is missing." \
                 "Copy terraform/terraform.tfvars.example to it and commit —" \
                 "it holds non-sensitive configuration only."
            exit 1
          fi

      - name: Plan
        run: |
          terraform -chdir=terraform plan -input=false -out=tfplan \
            -var="environment=${TF_ENVIRONMENT}" \
            -var="aws_region=${AWS_REGION}" \
            -var-file="${TF_ENVIRONMENT}.tfvars"

      - name: Render plan summary
        run: |
          {
            echo '### Terraform plan (`'"$TF_ENVIRONMENT"'`)'
            echo '```'
            terraform -chdir=terraform show -no-color tfplan
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The plan file pins exactly what apply will do — apply must never re-plan.
      - uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: |
            terraform/tfplan
            build/lambda.zip
          retention-days: 5

  apply:
    name: Terraform apply
    needs: plan
    runs-on: ubuntu-latest
    environment: production # required reviewers gate this job
    env:
      AWS_REGION: ${{ secrets.AWS_REGION || vars.AWS_REGION }}
      TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET || vars.TF_STATE_BUCKET }}
    outputs:
      function_name: ${{ steps.outputs.outputs.function_name }}
      secret_arn: ${{ steps.outputs.outputs.secret_arn }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: tfplan

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Init
        run: |
          terraform -chdir=terraform init -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=ai-log-investigator/${TF_ENVIRONMENT}/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Apply
        run: terraform -chdir=terraform apply -input=false -auto-approve tfplan

      - name: Export outputs
        id: outputs
        run: |
          echo "function_name=$(terraform -chdir=terraform output -raw lambda_function_name)" >> "$GITHUB_OUTPUT"
          echo "secret_arn=$(terraform -chdir=terraform output -raw secret_arn)" >> "$GITHUB_OUTPUT"

      # Push credentials held in GitHub into Secrets Manager, which is what the
      # Lambda actually reads at runtime. Values are merged, so keys managed
      # elsewhere survive; an unset GitHub secret leaves its stored value alone
      # rather than blanking it.
      #
      # This runs before the code update in `publish`, so the new containers
      # start with the new values (secrets are cached per container).
      - name: Sync credentials to Secrets Manager
        env:
          SECRET_ARN: ${{ steps.outputs.outputs.secret_arn }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SPLUNK_TOKEN: ${{ secrets.SPLUNK_TOKEN }}
          GRAFANA_TOKEN: ${{ secrets.GRAFANA_TOKEN }}
        run: |
          umask 077
          current=$(mktemp); updates=$(mktemp); merged=$(mktemp)
          trap 'rm -f "$current" "$updates" "$merged"' EXIT

          # jq reads from the environment, so no secret ever appears in argv.
          jq -n '{
            slack_webhook_url: env.SLACK_WEBHOOK_URL,
            slack_bot_token:   env.SLACK_BOT_TOKEN,
            splunk_token:      env.SPLUNK_TOKEN,
            grafana_token:     env.GRAFANA_TOKEN
          } | with_entries(select(.value != null and .value != ""))' > "$updates"

          count=$(jq 'length' "$updates")
          if [ "$count" -eq 0 ]; then
            echo "No credential secrets set in GitHub; leaving Secrets Manager untouched."
            exit 0
          fi

          aws secretsmanager get-secret-value --secret-id "$SECRET_ARN" \
            --query SecretString --output text > "$current" 2>/dev/null || true
          jq empty "$current" >/dev/null 2>&1 || echo '{}' > "$current"

          jq -s '.[0] * .[1]' "$current" "$updates" > "$merged"

          aws secretsmanager put-secret-value \
            --secret-id "$SECRET_ARN" --secret-string "file://$merged" >/dev/null

          echo "Synced from GitHub: $(jq -r 'keys | join(", ")' "$updates")"
          echo "Keys now present:   $(jq -r 'keys | join(", ")' "$merged")"

  publish:
    name: Publish Lambda code
    needs: apply
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_REGION: ${{ secrets.AWS_REGION || vars.AWS_REGION }}
      ARTIFACT_BUCKET: ${{ secrets.LAMBDA_ARTIFACT_BUCKET || vars.LAMBDA_ARTIFACT_BUCKET }}
      FUNCTION: ${{ needs.apply.outputs.function_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Preflight — artifact bucket
        run: |
          if [ -z "$ARTIFACT_BUCKET" ]; then
            echo "::error::LAMBDA_ARTIFACT_BUCKET is not set (secret or variable)."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Rebuilt from the same commit rather than reusing the artifact, so the
      # published code is provably the code in this ref.
      - name: Build deployment zip
        run: ./scripts/build_lambda.sh

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload package to S3
        id: upload
        run: |
          KEY="lambda/${TF_ENVIRONMENT}/${GITHUB_SHA}.zip"
          aws s3 cp build/lambda.zip "s3://${ARTIFACT_BUCKET}/${KEY}"
          echo "key=${KEY}" >> "$GITHUB_OUTPUT"

      - name: Update function code
        env:
          KEY: ${{ steps.upload.outputs.key }}
        run: |
          aws lambda update-function-code \
            --function-name "$FUNCTION" \
            --s3-bucket "$ARTIFACT_BUCKET" \
            --s3-key "$KEY" \
            --publish >/dev/null
          aws lambda wait function-updated --function-name "$FUNCTION"

      - name: Smoke test
        run: |
          # A payload with no service label must be rejected with 400 rather
          # than starting an investigation — cheap, side-effect-free, and it
          # proves the handler imports and runs.
          aws lambda invoke \
            --function-name "$FUNCTION" \
            --payload '{"detail":{"alerts":[{"labels":{"alertname":"deploy-smoke-test"}}]}}' \
            --cli-binary-format raw-in-base64-out \
            response.json >/dev/null
          cat response.json
          grep -q '"statusCode": *400' response.json

      - name: Summary
        run: |
          {
            echo "### Deployed"
            echo "- Function: \`${FUNCTION}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Package: \`s3://${ARTIFACT_BUCKET}/${{ steps.upload.outputs.key }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
